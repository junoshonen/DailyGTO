<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DailyGTO</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* VOICE: 라벨과 숫자. 설명 문장 없음.
   IDEA: 새벽 포커펍의 네온관 + 핸드 트레이너 (한 핸드를 끝까지 플레이).
   PICTURE: 세로 타원 테이블, 사각 좌석, 중앙 팟·보드, 칩, 말풍선, 타이머 링.
   COLOUR/TYPE: 거의 검정 바탕, 핫핑크·시안 네온, 액션별 네온색, 4색 카드. Sora / JetBrains Mono / Noto Sans KR.
   LAYOUT: 상단 바(n/10) → 히스토리 → 테이블 → 액션 버튼 / 피드백 패널. 해설은 바텀시트. */
:root{
  color-scheme:dark;
  --bg:#07060b;--panel:#110d18;--panel2:#191322;--line:#2c2239;--ink:#f3ecff;--muted:#9a8fb0;
  --brand:#ff2e97;--cyan:#22f0ff;
  --check:#22d3ff;--call:#22d3ff;--bet_s:#ffd23f;--bet_l:#ff8a1f;--raise:#ff2e97;--allin:#b04bff;--fold:#5a6a92;
  --good:#39ff9c;--ok:#b6ff3b;--warn:#ffd23f;--bad:#ff3b5c;
  --cs:#4a4f62;--ch:#d22a4b;--cd:#2b66d9;--cc:#1d9a57;
  --f-d:"Sora","Noto Sans KR",system-ui,sans-serif;--f-b:"Noto Sans KR",system-ui,sans-serif;--f-m:"JetBrains Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:radial-gradient(900px 520px at 6% -8%,rgba(255,46,151,.18),transparent 60%),radial-gradient(800px 520px at 104% 24%,rgba(34,240,255,.1),transparent 60%),var(--bg);background-attachment:fixed;color:var(--ink);font:15px/1.5 var(--f-b);overflow-x:clip;-webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(7,6,11,.9);backdrop-filter:blur(10px)}
.top-in,.main{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:52px}
.logo{font:800 18px var(--f-d);color:#ffe0f0;text-shadow:0 0 5px var(--brand),0 0 16px var(--brand);white-space:nowrap}
.logo b{color:#dcfeff;text-shadow:0 0 5px var(--cyan),0 0 16px var(--cyan)}
.count{font:700 16px var(--f-m);text-align:center}
.streak{justify-self:end;font:600 12px var(--f-m);border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--muted);white-space:nowrap}
.streak b{color:var(--ink)}
.main{padding-block:6px 40px;display:flex;flex-direction:column;gap:10px}

/* history */
.hist{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.hist::-webkit-scrollbar{display:none}
.h{flex:none;display:flex;align-items:center;gap:5px;height:30px;padding:0 8px;border-radius:6px;background:var(--panel);border:1px solid var(--line);font:700 11px var(--f-m);white-space:nowrap}
.h .w{color:var(--muted)}
.h .dot{width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 6px var(--c)}
.h.lbl{background:none;border:0;padding:0 2px;color:var(--muted);font-weight:500}
.h .mini{display:flex;gap:2px}
.mini i,.cc i{font:800 12px/1 var(--f-d);font-style:normal;color:#fff;width:16px;height:22px;border-radius:3px;display:grid;place-items:center}
.h.now{border-color:var(--brand);box-shadow:0 0 10px rgba(255,46,151,.5)}
.h.fin{border-color:var(--cyan);color:#dcfeff}

/* table */
.tablewrap{width:min(100%,max(240px,calc((100svh - 280px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)) * 3 / 3.8)));margin:0 auto}
.table{position:relative;width:100%;aspect-ratio:3/3.8}
.rail{position:absolute;inset:8% 12% 9%;border-radius:40%/27%;border:2px solid var(--brand);background:radial-gradient(ellipse at 50% 45%,rgba(34,240,255,.06),rgba(10,8,16,.55) 70%);box-shadow:0 0 6px var(--brand),0 0 22px rgba(255,46,151,.45),inset 0 0 18px rgba(255,46,151,.2)}
.center{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:6px;z-index:1}
.pot{font:800 clamp(16px,4.6vw,22px) var(--f-d);color:#dcfeff;text-shadow:0 0 8px var(--cyan);white-space:nowrap}
.board{display:flex;gap:3px;min-height:clamp(36px,10vw,52px)}
.card{width:clamp(26px,7.4vw,38px);aspect-ratio:5/7;border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font:800 clamp(15px,4.4vw,22px)/1 var(--f-d);box-shadow:0 3px 8px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.12)}
.card small{font-size:.45em;margin-top:2px;opacity:.85}
.s{background:var(--cs)}.h_{background:var(--ch)}.d{background:var(--cd)}.c{background:var(--cc)}
.card.back{background:repeating-linear-gradient(45deg,#5a1240 0 4px,#3a0c2a 4px 8px);box-shadow:inset 0 0 0 1.5px #e9e3f2}
.card.new{animation:deal .3s ease-out}
@keyframes deal{from{transform:translateY(-8px);opacity:0}}
.potchip{display:flex;align-items:center;gap:5px;font:600 11px var(--f-m);color:var(--muted)}
.potchip i{width:9px;height:9px;border-radius:50%;background:#bbb}
.tag{font:600 11px var(--f-m);color:var(--muted)}
.seat{position:absolute;transform:translate(-50%,-50%);z-index:2;display:flex;flex-direction:column;align-items:center}
.box{min-width:clamp(46px,13vw,60px);padding:3px 6px;border-radius:6px;background:#0e0a14;border:1.5px solid #2e2638;text-align:center;line-height:1.15}
.box b{display:block;font:700 clamp(10px,2.8vw,12px) var(--f-d)}
.box span{font:600 clamp(10px,2.8vw,12px) var(--f-m)}
.seat.out .box{color:#4e4560;border-color:#1f1828}
.seat.vil .box{border-color:var(--cyan);box-shadow:0 0 8px rgba(34,240,255,.45)}
.seat.hero .box{border-color:var(--brand);box-shadow:0 0 10px rgba(255,46,151,.6)}
.seat.turn .box{background:rgba(255,46,151,.18)}
.hole{display:flex;gap:2px;margin-bottom:3px}
.seat.vil .hole .card{width:clamp(16px,4.6vw,22px)}
.seat.hero .hole .card{width:clamp(28px,8vw,40px)}
.say{position:absolute;bottom:calc(100% + 2px);font:700 11px var(--f-d);padding:2px 7px;border-radius:5px;border:1.5px solid var(--c);color:var(--c);background:#0b0810;white-space:nowrap}
.seat.hero .say{bottom:auto;top:-22px}
.dealer{position:absolute;width:16px;height:16px;border-radius:50%;background:#f4f2f8;color:#14121a;font:700 9px/1 var(--f-d);display:grid;place-items:center;transform:translate(-50%,-50%);z-index:3}
.bet{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:4px;font:700 12px var(--f-m);color:#ffe0f0;z-index:3;white-space:nowrap}
.bet i{width:11px;height:11px;border-radius:50%;background:radial-gradient(circle,#fff 0 22%,#e0115f 23% 60%,#fff 61% 68%,#e0115f 69%);box-shadow:0 0 8px rgba(255,46,151,.7)}
.timer{position:absolute;left:0;top:0;width:clamp(34px,9vw,44px);height:clamp(34px,9vw,44px);z-index:4}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer span{position:absolute;inset:0;display:grid;place-items:center;font:700 clamp(12px,3.4vw,15px) var(--f-m)}

/* range */
.rbtn{position:absolute;right:0;top:0;z-index:4;min-height:34px;padding:0 12px;border-radius:8px;border:1.5px solid var(--cyan);background:#0b0810;color:#dcfeff;font:700 12px var(--f-d);cursor:pointer;box-shadow:0 0 10px rgba(34,240,255,.35)}
.intro{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 6px 5px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font:600 13px var(--f-m)}
.intro b{color:var(--ink)}.intro .ar{color:var(--muted)}
.intro .btn{flex:none;min-height:34px;padding:0 14px}
.tabs{display:flex;gap:4px;background:var(--panel2);padding:4px;border-radius:10px}
.tabs button{flex:1;min-height:38px;border:0;border-radius:7px;background:none;color:var(--muted);font:700 13px var(--f-d);cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.rnote{font:500 12px var(--f-b);color:var(--muted)}
/* actions */
.dock{min-height:118px;display:flex;flex-direction:column;justify-content:flex-start;gap:6px}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.opt{min-height:50px;border:0;border-radius:6px;cursor:pointer;font:800 14px var(--f-d);letter-spacing:.03em;background:var(--c);color:#0a0710;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 0 12px color-mix(in srgb,var(--c) 30%,transparent)}
.opt.fold{color:#fff}
.opt small{font:600 10px var(--f-m);letter-spacing:0;opacity:.75}
.opt:active{filter:brightness(1.15)}
.fb{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-radius:10px;background:var(--panel);border:1.5px solid var(--vb);box-shadow:0 0 14px color-mix(in srgb,var(--vb) 40%,transparent)}
.fb-row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px}
.fb-ic{font:800 22px var(--f-d);color:var(--vb);text-shadow:0 0 8px var(--vb)}
.fb-a b,.fb-f b{display:block;font:800 18px var(--f-d)}
.fb-a span,.fb-f span{font:500 11px var(--f-m);color:var(--muted)}
.fb-f{text-align:right}
.fb-bar{height:8px;border-radius:4px;background:var(--panel2);overflow:hidden}
.fb-bar i{display:block;height:100%;background:var(--vb)}
.fb-note{font:600 12px var(--f-m);color:var(--warn)}
.fb-btns{display:flex;gap:6px}
.btn{flex:1;min-height:44px;border-radius:8px;border:1.5px solid var(--line);background:var(--panel2);font:700 14px var(--f-d);cursor:pointer}
.btn.go{border:0;background:var(--brand);color:#fff;box-shadow:0 0 16px rgba(255,46,151,.55)}
.btn.cy{border-color:var(--cyan);color:#dcfeff}
.end{display:flex;flex-direction:column;gap:8px}
.endrow{display:grid;grid-template-columns:auto 1fr 1fr;gap:14px;align-items:center;padding:10px 14px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
.endrow b{display:block;font:800 22px var(--f-d)}
.endrow span{font:500 11px var(--f-m);color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips span{font:700 11px var(--f-m);padding:3px 8px;border-radius:999px;border:1px solid var(--c);color:var(--c)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end;background:rgba(0,0,0,.6)}
.sheet-in{max-height:88svh;overflow-y:auto;background:var(--bg);border-top:1.5px solid var(--brand);border-radius:16px 16px 0 0;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;width:100%;max-width:560px;margin:0 auto;box-shadow:0 -10px 30px rgba(255,46,151,.25)}
.sheet-h{display:flex;justify-content:space-between;align-items:center;font:700 15px var(--f-d)}
.x{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:16px}
.card2{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.rows{display:flex;flex-direction:column;gap:7px}
.row{display:grid;grid-template-columns:92px minmax(0,1fr) 42px 70px;align-items:center;gap:8px;font:500 12px var(--f-m)}
.row .n{font:600 13px var(--f-d);white-space:nowrap;color:color-mix(in srgb,var(--c) 70%,#fff)}
.row.me .n::after{content:" ◀";color:var(--brand)}
.track{height:9px;border-radius:5px;background:var(--panel2);overflow:hidden}
.track i{display:block;height:100%;background:var(--c)}
.num,.ev{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.ev{color:var(--muted)}
.xpl{display:flex;flex-direction:column;gap:7px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font:500 13.5px/1.5 var(--f-b)}
.xpl div{display:flex;gap:8px}.xpl div::before{content:"";flex:none;width:5px;height:5px;margin-top:9px;border-radius:50%;background:var(--cyan)}
.grid{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:1px;background:#000;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.cell{position:relative;aspect-ratio:1;background:#1a1522;border:0;padding:0;cursor:pointer;overflow:hidden}
.cell .fill{position:absolute;left:0;right:0;bottom:0;display:flex}
.cell .fill i{display:block;height:100%;background:var(--c)}
.cell span{position:absolute;left:2px;top:1px;font:600 clamp(7px,2vw,11px)/1.1 var(--f-m);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.9);z-index:1}
.cell.none span{color:#4e4560;text-shadow:none}
.cell.me{box-shadow:inset 0 0 0 2px #fff;z-index:2}
.cell.sel{box-shadow:inset 0 0 0 2px var(--brand);z-index:2}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:5px}
.tile{border-radius:6px;padding:7px 9px;background:color-mix(in srgb,var(--c) 30%,#0d0a12);border:1px solid color-mix(in srgb,var(--c) 60%,transparent);display:flex;flex-direction:column;min-height:76px}
.tile .tn{font:700 13px var(--f-d)}
.tile .tp{font:800 22px/1 var(--f-d);margin-top:auto}
.tile .tc{font:500 10px var(--f-m);color:rgba(255,255,255,.7);text-align:right}
.totbar{display:flex;height:10px;border-radius:3px;overflow:hidden;background:var(--panel2)}
.totbar i{display:block;height:100%;background:var(--c)}
.htitle{display:flex;justify-content:space-between;gap:8px;font:700 13px var(--f-d)}
.htitle span{color:var(--muted);font:500 11px var(--f-m)}
.combos{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:4px}
.combo{position:relative;border-radius:5px;overflow:hidden;background:#1a1522;min-height:74px;display:flex;flex-direction:column;justify-content:space-between;padding:5px 6px}
.combo .bg{position:absolute;inset:0;display:flex}
.combo .bg i{display:block;height:100%;background:var(--c);opacity:.85}
.combo .cc{position:relative;display:flex;gap:2px}
.combo .lines{position:relative;font:600 10px/1.35 var(--f-m);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.95)}
.combo.me{box-shadow:inset 0 0 0 2px #fff}

/* summary */
.sum{display:flex;flex-direction:column;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px 16px}
.big{font:800 clamp(44px,12vw,60px)/1 var(--f-d);color:#ffe0f0;text-shadow:0 0 10px var(--brand),0 0 30px var(--brand)}
.big small{font-size:.38em;color:var(--muted);text-shadow:none;margin-left:6px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
.stat .k{font:500 11px var(--f-m);color:var(--muted)}
.stat .v{font:700 19px var(--f-m)}
.foot{font:500 11px var(--f-m);color:#5e5470;text-align:center}
@media(prefers-reduced-motion:reduce){.card.new{animation:none}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="logo">Daily<b>GTO</b></div>
  <div class="count" id="count"></div>
  <span class="streak" id="streak"></span>
</div></header>
<main class="main" id="app"></main>
<div id="sheet"></div>
<script>
{
const POS=["UTG","HJ","CO","BTN","SB","BB"];
const SUIT={s:"♠",h:"♥",d:"♦",c:"♣"},SC={s:"s",h:"h_",d:"d",c:"c"};
const R="AKQJT98765432",STREET=["Flop","Turn","River"];
const N=10,TIME=30;
const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
const $=id=>document.getElementById(id);
const app=$("app");
const KEY="dgto-v3";
let store={};try{store=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}};
const dayNum=Math.floor((Date.now()+9*3600e3)/864e5);
const dkey=d=>new Date(d*864e5).toISOString().slice(0,10);
const today=dkey(dayNum);
store[today]=store[today]||{hands:[]};
const rec=store[today];
const cache={};
const load=id=>cache[id]||(cache[id]=fetch(`data/hands/${id}.json`).then(r=>r.json()));

const rk=c=>c[0]==="T"?"10":c[0];
const cardHTML=(c,x="")=>`<div class="card ${SC[c[1]]} ${x}">${rk(c)}<small>${SUIT[c[1]]}</small></div>`;
const mini=c=>`<i class="${SC[c[1]]}">${c[0]}</i>`;
const clsOf=c=>{const a=c[0],b=c[2];if(a===b)return a+b;const[h,l]=[a,b].sort((x,y)=>R.indexOf(x)-R.indexOf(y));return h+l+(c[1]===c[3]?"s":"o")};
const fmt=x=>(Math.round(x*10)/10).toString();
const col=k=>`var(--${k})`;
const pct=x=>Math.round(x*100);
const isCard=t=>/^[2-9TJQKA][shdc]$/.test(t);

// preflop: folds to BTN, BTN opens 2.5, SB folds, BB calls
const PRE=[["UTG","F"],["HJ","F"],["CO","F"],["BTN","R",2.5],["SB","F"],["BB","C"]];

let RANGES=null,INDEX=[],mode="daily",list=[],hi=0,hand=null,ni=0,shown=0,timerId=null,left=TIME,phase="idle",lastAns=null,autoId=null;

function events(path){
  const ev=PRE.map(([s,a,v])=>({s,a,v,pre:1}));
  let p=0;
  for(const t of path){
    if(isCard(t)){ev.push({card:t});p=0;continue}
    ev.push({s:p===0?"BB":"BTN",a:t[0],v:+t.slice(1)/10});p=1-p;
  }
  return ev;
}

function state(ev,k){
  const st={stack:{},bet:{},out:{},say:{},board:hand.flop.match(/../g).slice(0,0),pot:0,hist:[],street:0,fold:null};
  POS.forEach(p=>{st.stack[p]=100;st.bet[p]=0});
  st.stack.SB=99.5;st.bet.SB=.5;st.stack.BB=99;st.bet.BB=1;
  const flop=hand.flop.match(/../g);
  st.hist.push({lbl:"PreFlop"});
  const collect=()=>{POS.forEach(p=>{st.pot+=st.bet[p];st.bet[p]=0});st.say={}};
  let flopShown=false;
  for(let i=0;i<k;i++){
    const e=ev[i];
    if(!e.pre&&!flopShown){collect();st.board=[...flop];flopShown=true;st.hist.push({street:"FLOP",pot:st.pot,cards:flop})}
    if(e.card){collect();st.board=[...st.board,e.card];st.street++;st.hist.push({street:st.street===1?"TURN":"RIVER",pot:st.pot,cards:[e.card]});continue}
    const before=st.stack[e.s],mx=Math.max(...POS.map(p=>st.bet[p]));let txt,kd;
    if(e.a==="F"){st.out[e.s]=1;txt="Fold";kd="fold";if(!e.pre)st.fold=e.s}
    else if(e.a==="X"){txt="Check";kd="check"}
    else if(e.a==="C"){st.stack[e.s]-=mx-st.bet[e.s];st.bet[e.s]=mx;txt="Call";kd="call"}
    else{st.stack[e.s]-=e.v-st.bet[e.s];st.bet[e.s]=e.v;txt=(e.a==="B"?"B ":e.a==="R"?"R ":"All-in ")+fmt(e.v);kd=e.a==="A"?"allin":e.a==="R"?"raise":"bet_s"}
    st.say[e.s]={t:e.a==="B"||e.a==="R"?"":txt,k:kd};
    st.hist.push({s:e.s,stack:before,t:txt,k:kd});
  }
  if(!flopShown&&k>=ev.length&&ev.length>PRE.length){}
  return st;
}

function histHTML(st,end){
  return st.hist.map(x=>x.lbl?`<div class="h lbl">${x.lbl}</div>`:x.street?`<div class="h"><span class="w">${x.street}</span><span>${fmt(x.pot)}</span><span class="mini">${x.cards.map(mini).join("")}</span></div>`
    :`<div class="h"><span class="w">${x.s}</span><span class="w">${fmt(x.stack)}</span><span class="dot" style="--c:${col(x.k)}"></span>${x.t.toUpperCase()}</div>`).join("")
    +(end?`<div class="h fin">Fin</div>`:phase==="ask"?`<div class="h now">${hand.hero} ???</div>`:"");
}

function tableHTML(st,end,newCard){
  const hero=hand.hero,hix=POS.indexOf(hero);
  const slots=[[50,90],[11,67],[11,31],[50,8],[89,31],[89,67]];
  const betAt=[[50,74],[28,62],[28,37],[50,22],[72,37],[72,62]];
  const dAt=[[36,88],[20,77],[20,42],[63,13],[80,42],[80,77]];
  let h="",b="";
  POS.forEach((p,i)=>{
    const k=(i-hix+6)%6,[x,y]=slots[k],me=p===hero,out=st.out[p];
    const vil=!me&&(p==="BTN"||p==="BB")&&!out;
    const showV=end&&vil&&st.fold!==p;
    const cards=me?`<div class="hole">${cardHTML(hand.hc.slice(0,2))}${cardHTML(hand.hc.slice(2))}</div>`:vil?`<div class="hole">${showV?cardHTML(hand.vc.slice(0,2))+cardHTML(hand.vc.slice(2)):'<div class="card back"></div><div class="card back"></div>'}</div>`:"";
    const sy=st.say[p]&&st.say[p].t?`<div class="say" style="--c:${col(st.say[p].k)}">${st.say[p].t}</div>`:"";
    h+=`<div class="seat ${me?"hero":vil?"vil":out||(p!=="BTN"&&p!=="BB")?"out":""}${me&&phase==="ask"?" turn":""}" style="left:${x}%;top:${y}%">${sy}${cards}<div class="box"><b>${p}</b><span>${fmt(st.stack[p])}</span></div></div>`;
    if(p==="BTN"){const[dx,dy]=dAt[k];h+=`<div class="dealer" style="left:${dx}%;top:${dy}%">D</div>`}
    if(st.bet[p]>0){const[bx,by]=betAt[k];b+=`<div class="bet" style="left:${bx}%;top:${by}%"><i></i>${fmt(st.bet[p])}</div>`}
  });
  const total=st.pot+POS.reduce((a,p)=>a+st.bet[p],0);
  const timer=phase==="ask"?`<div class="timer"><svg viewBox="0 0 44 44"><circle cx="22" cy="22" r="19" fill="none" stroke="#2c2239" stroke-width="4"/><circle id="tring" cx="22" cy="22" r="19" fill="none" stroke="var(--brand)" stroke-width="4" stroke-linecap="round" stroke-dasharray="119.4" stroke-dashoffset="${119.4*(1-left/TIME)}"/></svg><span id="tnum">${left}</span></div>`:"";
  return`<div class="tablewrap"><div class="table">${timer}<button class="rbtn" id="rbtn">Range</button><div class="rail"></div><div class="center"><div class="pot">${fmt(total)} BB</div><div class="board">${st.board.map((c,i)=>cardHTML(c,newCard&&i===st.board.length-1?"new":"")).join("")}</div>${st.pot>0&&st.board.length?`<div class="potchip"><i></i>${fmt(st.pot)} BB</div>`:""}<div class="tag">BTN 2.5bb 오픈 · BB 콜</div></div>${h}${b}</div></div>`;
}

function grade(n,i){
  const f=n.s[i],l=n.l[i];
  if(i===n.b||f>=.5)return["best","✓✓","Best move","var(--good)"];
  if(f>=.2||(f>=.05&&l<=.05))return["mix","✓","Mix","var(--ok)"];
  if(l<=.15)return["inacc","!","Inaccuracy","var(--warn)"];
  return["mistake","✗","Wrong move","var(--bad)"];
}
const score=(n,i)=>Math.min(1,n.s[i]/n.s[n.b]);
const right=g=>g==="best"||g==="mix";
const btnLabel=a=>a.k==="check"?"CHECK":a.k==="call"?"CALL":a.k==="fold"?"FOLD":a.k==="allin"?`ALL-IN<small>${fmt(a.amt)}</small>`:a.k==="raise"?`R ${fmt(a.amt)}`:`B ${fmt(a.amt)}<small>${a.t.split(" ")[1]}</small>`;

function hrec(){return mode==="daily"?(rec.hands[hi]=rec.hands[hi]||{d:[]}):(hand._r=hand._r||{d:[]})}

function header(){
  $("count").textContent=mode==="daily"?`${Math.min(hi+1,N)} / ${N}`:"Practice";
  const done=d=>store[dkey(d)]&&store[dkey(d)].hands.filter(h=>h&&h.done).length>=N;
  let k=0,d=dayNum;if(!done(d))d--;while(done(d)){k++;d--}
  $("streak").innerHTML=`Streak <b>${k}</b>`;
}

function draw(ev,k,end,newCard,dock){
  const st=state(ev,k);
  app.innerHTML=`<div class="hist" id="hist">${histHTML(st,end)}</div>${tableHTML(st,end,newCard)}<div class="dock" id="dock">${dock||""}</div>`;
  const hs=$("hist");hs.scrollLeft=hs.scrollWidth;
  $("rbtn").onclick=()=>rangeSheet();
  const ri=$("rintro");if(ri)ri.onclick=()=>rangeSheet();
}
function introHTML(){
  if(!RANGES)return"";
  return`<div class="intro"><span>Preflop: <b>BTN 2.5bb 오픈</b> <span class="ar">→</span> <b>BB 콜</b></span><button class="btn cy" id="rintro">레인지</button></div>`;
}
function rangeSheet(tab){
  const vil=hand.hero==="BB"?"BTN":"BB";tab=tab||vil;
  const r=RANGES[tab],me=clsOf(hand.hc),k=tab==="BTN"?"raise":"call";
  let g="";
  for(let a=0;a<13;a++)for(let c=0;c<13;c++){
    const key=a===c?R[a]+R[c]:a<c?R[a]+R[c]+"s":R[c]+R[a]+"o",w=r.w[key]||0;
    g+=`<div class="cell${w?"":" none"}${tab===hand.hero&&key===me?" me":""}">${w?`<div class="fill" style="height:${w*100}%"><i style="width:100%;--c:var(--${k})"></i></div>`:""}<span>${key}</span></div>`;
  }
  $("sheet").innerHTML=`<div class="sheet" id="sh"><div class="sheet-in">
    <div class="sheet-h"><span>Preflop Range</span><button class="x" id="x" aria-label="닫기">✕</button></div>
    <div class="tabs">${["BTN","BB"].map(t=>`<button data-t="${t}" aria-pressed="${t===tab}">${RANGES[t].label}${t===hand.hero?" (나)":""}</button>`).join("")}</div>
    <div class="htitle">${r.label}<span>전체 핸드 중 ${r.pct}%</span></div>
    <div class="grid">${g}</div>
    <div class="rnote">이 퀴즈가 가정한 프리플랍 레인지입니다. 포스트플랍 정답은 이 레인지를 기준으로 계산됐습니다. 레인지 자체는 솔버 결과가 아닌 근사치입니다. 칸이 일부만 차 있으면 그 비율만큼만 플레이합니다.</div>
  </div></div>`;
  const close=()=>{$("sheet").innerHTML=""};
  $("x").onclick=close;$("sh").onclick=e=>{if(e.target.id==="sh")close()};
  $("sh").querySelector(".tabs").onclick=e=>{const b=e.target.closest("button");if(b)rangeSheet(b.dataset.t)};
}

function play(target,done){
  // animate from `shown` to `target` events
  const node=hand.nodes[ni],ev=events(node.p);
  const step=()=>{
    if(shown>=target){done(ev);return}
    shown++;const e=ev[shown-1];
    draw(ev,shown,false,e&&e.card,ni===0?introHTML():"");
    setTimeout(step,reduce?0:(e&&e.pre?180:420));
  };
  step();
}

async function openHand(i){
  clearTimers();hi=i;hand=await load(list[i]);header();
  const r=hrec();
  ni=Math.min(r.d.length,hand.nodes.length-1);shown=0;
  if(r.done){ni=hand.nodes.length-1;shown=events(hand.nodes[ni].p).length;return endHand()}
  if(r.d.length)shown=events(hand.nodes[ni].p).length;
  scrollTo(0,0);toNode();
}

function toNode(){
  const node=hand.nodes[ni];
  const ev=events(node.p);
  phase="anim";
  play(ev.length,()=>{node.end?endHand():ask()});
}

function ask(){
  phase="ask";left=TIME;lastAns=null;
  const node=hand.nodes[ni],ev=events(node.p);
  const opts=node.a.map((a,i)=>`<button class="opt ${a.k}" data-i="${i}" style="--c:${col(a.k)}">${btnLabel(a)}</button>`).join("");
  draw(ev,ev.length,false,false,`${ni===0?introHTML():""}<div class="opts" id="opts">${opts}</div>`);
  $("opts").onclick=e=>{const b=e.target.closest(".opt");if(b)answer(+b.dataset.i,false)};
  timerId=setInterval(()=>{left--;const n=$("tnum"),r=$("tring");if(n)n.textContent=left;if(r)r.setAttribute("stroke-dashoffset",119.4*(1-left/TIME));
    if(left<=0){const a=hand.nodes[ni].a;let i=a.findIndex(x=>x.k==="check");if(i<0)i=a.findIndex(x=>x.k==="fold");answer(i,true)}},1000);
}

function clearTimers(){clearInterval(timerId);clearTimeout(autoId);timerId=null}

function answer(i,timeout){
  clearTimers();phase="fb";
  const node=hand.nodes[ni],r=hrec();
  r.d[ni]=[i,timeout?1:0];if(mode==="daily")save();
  const[gk,ic,gt,gc]=grade(node,i);
  const ev=events(node.p);
  const best=node.a[node.b];
  const dock=`<div class="fb" style="--vb:${gc}">
    <div class="fb-row"><span class="fb-ic">${ic}</span><div class="fb-a"><b>${node.a[i].t}</b><span>${timeout?"Time out":gt}</span></div><div class="fb-f"><b>${(node.s[i]*100).toFixed(1)} %</b><span>Freq${node.l[i]>0?` · EV −${node.l[i].toFixed(2)}`:""}</span></div></div>
    <div class="fb-bar"><i style="width:${node.s[i]*100}%"></i></div>
    ${gk==="mix"?`<div class="fb-note" style="color:var(--ok)">섞어 쓰는 선택 · 주로 ${best.t} ${(node.s[node.b]*100).toFixed(1)}%</div>`:i!==node.b?`<div class="fb-note">GTO: ${best.t} ${(node.s[node.b]*100).toFixed(1)}% · 정답 라인으로 진행</div>`:""}
    <div class="fb-btns"><button class="btn cy" id="why">해설</button><button class="btn go" id="go">계속</button></div></div>`;
  draw(ev,ev.length,false,false,dock);
  $("why").onclick=()=>{clearTimeout(autoId);sheet(node,i)};
  $("go").onclick=next;
}

function next(){clearTimers();$("sheet").innerHTML="";ni++;toNode()}

function endHand(){
  phase="end";clearTimers();
  const node=hand.nodes[ni],ev=events(node.p),r=hrec();
  if(!r.done){r.done=1;if(mode==="daily")save()}
  const ds=r.d.map((x,j)=>x&&{n:hand.nodes[j],i:x[0]}).filter(Boolean);
  const sc=ds.length?ds.reduce((a,d)=>a+score(d.n,d.i),0)/ds.length:1;
  const loss=ds.reduce((a,d)=>a+d.n.l[d.i],0);
  const last=mode==="daily"&&hi===N-1;
  const dock=`<div class="end"><div class="endrow"><span class="fb-ic" style="--vb:${sc>=.8?"var(--good)":sc>=.5?"var(--warn)":"var(--bad)"}">${sc>=.8?"✓✓":sc>=.5?"!":"✗"}</span><div><b>${pct(sc)}%</b><span>Score</span></div><div><b>${loss.toFixed(2)}</b><span>BB EV Loss</span></div></div>
    <div class="chips">${ds.map(d=>{const g=grade(d.n,d.i);return`<span style="--c:${g[3]}">${STREET[d.n.p.filter(isCard).length]} ${g[1]}</span>`}).join("")}</div>
    <button class="btn go" id="go">${last?"오늘 결과":"다음 핸드"}</button></div>`;
  draw(ev,ev.length,true,false,dock);
  $("go").onclick=()=>{if(mode==="daily"){if(hi<N-1)openHand(hi+1);else summary()}else{if(hi+1>=list.length)list.push(...shuffled());openHand(hi+1)}};
}

function sheet(node,i){
  const acts=node.a,me=clsOf(hand.hc);
  const rows=acts.map((a,j)=>`<div class="row${j===i?" me":""}" style="--c:${col(a.k)}"><span class="n">${a.t}</span><div class="track"><i style="width:${node.s[j]*100}%"></i></div><span class="num">${pct(node.s[j])}%</span><span class="ev">${node.l[j]===0?"EV max":"−"+node.l[j].toFixed(2)+"bb"}</span></div>`).join("");
  let g="";
  for(let r=0;r<13;r++)for(let c=0;c<13;c++){
    const k=r===c?R[r]+R[c]:r<c?R[r]+R[c]+"s":R[c]+R[r]+"o",v=node.ch[k];
    const fill=v?`<div class="fill" style="height:${Math.max(v[0]*100,8)}%">${acts.map((a,j)=>v[j+1]>0?`<i style="width:${v[j+1]*100}%;--c:${col(a.k)}"></i>`:"").join("")}</div>`:"";
    g+=`<button class="cell${v?"":" none"}${k===me?" me":""}" data-k="${k}" aria-label="${k}">${fill}<span>${k}</span></button>`;
  }
  const tiles=acts.map((a,j)=>`<div class="tile" style="--c:${col(a.k)}"><span class="tn">${a.t}</span><span class="tp">${(node.tot[j]*100).toFixed(1)}%</span><span class="tc">${node.cmb[j].toFixed(1)} combos</span></div>`).join("");
  const tot=acts.map((a,j)=>`<i style="width:${node.tot[j]*100}%;--c:${col(a.k)}"></i>`).join("");
  const combos=node.hcls.map(([c,...s])=>`<div class="combo${c===hand.hc?" me":""}"><div class="bg">${acts.map((a,j)=>s[j]>0?`<i style="width:${s[j]*100}%;--c:${col(a.k)}"></i>`:"").join("")}</div><span class="cc">${mini(c.slice(0,2))}${mini(c.slice(2))}</span><div class="lines">${acts.map((a,j)=>`${a.t} ${pct(s[j])}`).join("<br>")}</div></div>`).join("");
  $("sheet").innerHTML=`<div class="sheet" id="sh"><div class="sheet-in">
    <div class="sheet-h"><span>${hand.hc.replace(/(..)(..)/,"$1 $2")} · ${STREET[node.p.filter(isCard).length]} · Equity ${pct(node.eq)}%</span><button class="x" id="x" aria-label="닫기">✕</button></div>
    <div class="card2"><div class="rows">${rows}</div><div class="xpl">${node.x.map(t=>`<div>${t}</div>`).join("")}</div></div>
    <div class="card2" style="display:flex;flex-direction:column;gap:10px"><div class="htitle">${hand.hero} Strategy</div><div class="tiles">${tiles}</div><div class="totbar">${tot}</div>
      <div class="grid" id="grid">${g}</div>
      <div class="htitle" id="ht">Hands · ${me}<span>${node.hcls.length} combos</span></div><div class="combos">${combos}</div></div>
  </div></div>`;
  const close=()=>{$("sheet").innerHTML=""};
  $("x").onclick=close;$("sh").onclick=e=>{if(e.target.id==="sh")close()};
  const grid=$("grid"),ht=$("ht");
  grid.onclick=e=>{const c=e.target.closest(".cell");if(!c)return;const k=c.dataset.k,v=node.ch[k];
    grid.querySelectorAll(".sel").forEach(x=>x.classList.remove("sel"));if(k!==me)c.classList.add("sel");
    ht.innerHTML=`${k}<span>${v?acts.map((a,j)=>`${a.t} ${pct(v[j+1])}`).join(" · "):"Not in range"}</span>`};
}

function shuffled(){const a=[...INDEX];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

async function summary(){
  clearTimers();mode="daily";hi=N;header();$("count").textContent="Result";
  const per=[[0,0],[0,0],[0,0]];let loss=0,n=0,ok=0,sc=0;
  for(let i=0;i<N;i++){const h=await load(list[i]);const r=rec.hands[i]||{d:[]};
    r.d.forEach((x,j)=>{if(!x)return;const nd=h.nodes[j],k=nd.p.filter(isCard).length,g=grade(nd,x[0]);per[k][1]++;n++;loss+=nd.l[x[0]];sc+=score(nd,x[0]);if(right(g[0])){per[k][0]++;ok++}})}
  app.innerHTML=`<div class="sum">
    <div class="big">${n?pct(sc/n):0}%<small>Score</small></div>
    <div class="stats"><div class="stat"><div class="k">EV Loss</div><div class="v">${loss.toFixed(2)}</div></div><div class="stat"><div class="k">정답</div><div class="v">${ok}/${n}</div></div><div class="stat"><div class="k">Hands</div><div class="v">${N}</div></div></div>
    <div class="stats">${STREET.map((st,k)=>`<div class="stat"><div class="k">${st}</div><div class="v">${per[k][1]?`${per[k][0]}/${per[k][1]}`:"–"}</div></div>`).join("")}</div>
    <button class="btn cy" id="more">추가 핸드</button>
  </div><div class="foot">Next set 00:00 KST</div>`;
  $("more").onclick=()=>{mode="practice";list=shuffled();openHand(0)};
}

Promise.all([fetch("data/hands/index.json").then(r=>r.json()),fetch("data/ranges.json").then(r=>r.json())]).then(([d,rg])=>{
  RANGES=rg;INDEX=d.hands;
  list=Array.from({length:N},(_,i)=>INDEX[(dayNum*N+i)%INDEX.length]);
  const open=Array.from({length:N},(_,i)=>i).find(i=>!(rec.hands[i]&&rec.hands[i].done));
  if(open==null)summary();else openHand(open);
}).catch(()=>{app.innerHTML=`<div class="foot">데이터를 불러오지 못했습니다. 새로고침해 주세요.</div>`});
}
</script>
</body>
</html>
