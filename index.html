<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DailyGTO</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* VOICE: 짧은 라벨과 숫자. 설명 문장 없음.
   IDEA: 새벽 포커펍의 네온관 + 솔버 트레이너 화면.
   PICTURE: 네온 레일 타원 테이블, 원형 좌석(포지션·스택), 중앙 팟·보드, 칩.
   COLOUR/TYPE: 거의 검정 바탕, 핫핑크·시안 네온, 액션별 네온색, 4색 카드. Sora / JetBrains Mono / Noto Sans KR.
   LAYOUT: 상단 바 → 히스토리 스트립 → 테이블 → 큰 액션 버튼 → 결과(좌 13x13, 우 액션 타일·콤보). */
:root{
  color-scheme:dark;
  --bg:#07060b;--panel:#110d18;--panel2:#191322;--line:#2c2239;--ink:#f3ecff;--muted:#9a8fb0;
  --brand:#ff2e97;--cyan:#22f0ff;
  --check:#22d3ff;--call:#22d3ff;--bet_s:#ffd23f;--bet_l:#ff8a1f;--raise:#ff2e97;--allin:#b04bff;--fold:#56617e;
  --good:#39ff9c;--ok:#b6ff3b;--warn:#ffd23f;--bad:#ff3b5c;
  --cs:#4a4f62;--ch:#d22a4b;--cd:#2b66d9;--cc:#1d9a57;
  --f-d:"Sora","Noto Sans KR",system-ui,sans-serif;--f-b:"Noto Sans KR",system-ui,sans-serif;--f-m:"JetBrains Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:radial-gradient(900px 520px at 6% -8%,rgba(255,46,151,.2),transparent 60%),radial-gradient(800px 520px at 104% 24%,rgba(34,240,255,.11),transparent 60%),radial-gradient(700px 420px at 30% 112%,rgba(176,75,255,.14),transparent 60%),var(--bg);background-attachment:fixed;color:var(--ink);font:15px/1.5 var(--f-b);overflow-x:clip;-webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(7,6,11,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in,.main{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{display:flex;align-items:center;gap:14px;height:56px}
.logo{font:800 21px var(--f-d);letter-spacing:-.01em;color:#ffe0f0;text-shadow:0 0 5px var(--brand),0 0 16px var(--brand),0 0 34px rgba(255,46,151,.55);white-space:nowrap}
.logo b{color:#dcfeff;text-shadow:0 0 5px var(--cyan),0 0 16px var(--cyan)}
.date{color:var(--muted);font:500 13px var(--f-m)}
.sp{flex:1}
.prog{display:flex;gap:5px}
.prog span{width:22px;height:5px;border-radius:3px;background:var(--line)}
.prog span.on{background:var(--brand);box-shadow:0 0 10px var(--brand)}
.prog span.g{background:var(--good);box-shadow:0 0 8px var(--good)}.prog span.y{background:var(--warn)}.prog span.r{background:var(--bad);box-shadow:0 0 8px var(--bad)}
.chip{font:600 12px var(--f-m);border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--muted);white-space:nowrap}
.chip b{color:var(--ink)}
.main{padding-block:12px 56px;display:flex;flex-direction:column;gap:12px}

/* history strip */
.hist{display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin;padding-bottom:2px}
.h{flex:none;display:flex;align-items:center;gap:6px;height:38px;padding:0 4px 0 10px;border-radius:7px;background:var(--panel);border:1px solid var(--line);font:700 12px var(--f-m);white-space:nowrap}
.h .w{color:var(--muted)}
.h .st{color:var(--muted);font-weight:500}
.h .ac{height:28px;display:flex;align-items:center;padding:0 9px;border-radius:5px;background:var(--panel2);font:700 13px var(--f-d);color:color-mix(in srgb,var(--c,#fff) 70%,#fff)}
.h.street{padding-right:6px}
.h .mini{display:flex;gap:2px}
.h .mini i{font:800 12px/1 var(--f-d);font-style:normal;color:#fff;width:17px;height:24px;border-radius:3px;display:grid;place-items:center}
.h.now{border-color:var(--brand);box-shadow:0 0 10px rgba(255,46,151,.5),inset 0 0 8px rgba(255,46,151,.2);padding-right:12px}
.h.now .ac{background:none;color:#ffe0f0;padding:0}
.h.q .ac{color:var(--brand);background:none;padding:0 2px}

/* table */
.tablewrap{width:min(100%,max(240px,calc((100svh - 300px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)) * 3 / 3.9)));margin:0 auto}
.table{position:relative;width:100%;aspect-ratio:3/3.9}
.rail{position:absolute;inset:7% 13% 7%;border-radius:38%/26%;border:2px solid var(--brand);background:radial-gradient(ellipse at 50% 45%,rgba(34,240,255,.07),rgba(10,8,16,.55) 70%);box-shadow:0 0 6px var(--brand),0 0 24px rgba(255,46,151,.5),inset 0 0 20px rgba(255,46,151,.22)}
.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:6px}
.spot{font:500 clamp(10px,1.4vw,13px) var(--f-m);color:var(--muted);white-space:nowrap}
.pot{font:800 clamp(15px,2.4vw,22px) var(--f-d);color:#dcfeff;text-shadow:0 0 8px var(--cyan);white-space:nowrap}
.board{display:flex;gap:clamp(2px,.5vw,4px)}
.card{width:clamp(28px,5.4vw,46px);aspect-ratio:5/7;border-radius:clamp(3px,.6vw,6px);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font:800 clamp(16px,3.2vw,28px)/1 var(--f-d);box-shadow:0 3px 10px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.12)}
.card small{font-size:.42em;margin-top:2px;opacity:.85}
.s{background:var(--cs)}.h_{background:var(--ch)}.d{background:var(--cd)}.c{background:var(--cc)}
.card.back{background:repeating-linear-gradient(45deg,#5a1240 0 4px,#3a0c2a 4px 8px);box-shadow:inset 0 0 0 2px #e9e3f2}
.card.new{box-shadow:0 0 0 2px var(--cyan),0 0 12px var(--cyan)}
.seat{position:absolute;transform:translate(-50%,-50%);z-index:2}
.disc{width:clamp(50px,8.6vw,74px);aspect-ratio:1;border-radius:50%;background:#100c16;border:2px solid #2e2638;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.disc b{font:700 clamp(11px,1.7vw,15px) var(--f-d)}
.disc span{font:600 clamp(10px,1.5vw,13px) var(--f-m)}
.seat.out .disc{color:#5a5070;background:#0b0810}
.seat.vil .disc{border-color:var(--cyan);box-shadow:0 0 10px rgba(34,240,255,.55),inset 0 0 8px rgba(34,240,255,.3)}
.seat.hero .disc{border-color:var(--brand);box-shadow:0 0 12px var(--brand),inset 0 0 10px rgba(255,46,151,.35)}
.hole{position:absolute;top:50%;transform:translateY(-50%);display:flex;gap:3px}
.hole.r{left:calc(100% + 6px)}.hole.l{right:calc(100% + 6px)}
.hole.dn{top:calc(100% + 4px);left:50%;transform:translateX(-50%)}
.you{position:absolute;bottom:calc(100% + 5px);left:50%;transform:translateX(-50%);font:800 11px var(--f-d);letter-spacing:.12em;color:#0a0710;background:var(--brand);padding:2px 9px;border-radius:999px;box-shadow:0 0 12px var(--brand);white-space:nowrap}
.seat.hero .disc{background:radial-gradient(circle at 50% 35%,#6a1244,#2a0619)}
.say{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);font:800 13px var(--f-d);padding:4px 10px;border-radius:7px;background:var(--c);color:#0a0710;white-space:nowrap;box-shadow:0 0 14px color-mix(in srgb,var(--c) 60%,transparent);z-index:4}
.say::after{content:"";position:absolute;left:50%;top:100%;transform:translateX(-50%);border:6px solid transparent;border-top-color:var(--c)}
.say.fold{color:#fff}
.seat.hero .hole .card{width:clamp(34px,6.4vw,54px)}
.seat.vil .hole .card{width:clamp(16px,2.8vw,24px)}
.dealer{position:absolute;width:clamp(16px,2.4vw,20px);aspect-ratio:1;border-radius:50%;background:#f4f2f8;color:#14121a;font:700 clamp(9px,1.3vw,11px)/1 var(--f-d);display:grid;place-items:center;transform:translate(-50%,-50%);z-index:3}
.bet{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:5px;font:700 clamp(11px,1.6vw,14px) var(--f-m);color:#ffe0f0;text-shadow:0 0 6px rgba(255,46,151,.8);z-index:3;white-space:nowrap}
.bet i{width:clamp(12px,1.8vw,16px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#fff 0 22%,#e0115f 23% 60%,#fff 61% 68%,#e0115f 69%);box-shadow:0 2px 0 #7a0634,0 0 10px rgba(255,46,151,.7)}

/* actions */
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{flex:1 1 28%;min-height:62px;border:0;border-radius:6px;cursor:pointer;font:800 clamp(13px,1.8vw,16px) var(--f-d);letter-spacing:.04em;text-transform:uppercase;background:var(--c);color:#0a0710;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;box-shadow:0 0 14px color-mix(in srgb,var(--c) 35%,transparent);transition:filter .1s,box-shadow .1s}
.opt[style*="fold"]{color:#fff}
.opt:hover:not(:disabled){filter:brightness(1.12);box-shadow:0 0 22px color-mix(in srgb,var(--c) 60%,transparent)}
.opt:disabled{cursor:default}
.opt.dim{opacity:.5;box-shadow:none}
.opt.pick{box-shadow:0 0 0 3px #fff,0 0 24px var(--c)}
.prompt{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;min-height:54px;padding:8px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font:700 15px var(--f-d)}
.prompt .vil{color:#dcfeff;text-shadow:0 0 6px var(--cyan)}
.prompt .pa{padding:3px 9px;border-radius:6px;background:var(--c);color:#0a0710}
.prompt .arr{color:var(--muted)}
.prompt .me{color:#ffb3d9;text-shadow:0 0 6px var(--brand)}
.vbar{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:58px;padding:8px 16px;border-radius:10px;background:var(--vb);color:#0a0710;box-shadow:0 0 22px var(--vb)}
.vbar b{font:800 22px var(--f-d);display:flex;align-items:center;gap:8px}
.vbar span{font:700 13px var(--f-m);text-align:right}
.opt .fq{font:700 12px var(--f-m);letter-spacing:0;text-transform:none;opacity:.9}
.opt.gto::after{content:"GTO";position:absolute;top:-8px;right:6px;font:800 10px var(--f-m);background:#fff;color:#0a0710;padding:1px 6px;border-radius:999px}
.opt{position:relative}
.opt small{font:600 11px var(--f-m);letter-spacing:0;text-transform:none;opacity:.75}

/* result */
.res{display:flex;flex-direction:column;gap:14px}
#res{scroll-margin-top:68px}
.card2{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.verdict{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.vbadge{font:700 17px var(--f-d);padding:5px 14px;border-radius:8px;color:#0b0710;background:var(--vb);box-shadow:0 0 16px var(--vb)}
.vmeta{font:500 13px var(--f-m);color:var(--muted)}
.vmeta b{color:var(--ink)}
.rows{display:flex;flex-direction:column;gap:7px}
.row{display:grid;grid-template-columns:100px minmax(0,1fr) 46px 78px;align-items:center;gap:10px;font:500 13px var(--f-m)}
.row .n{font:600 13px var(--f-d);white-space:nowrap;color:color-mix(in srgb,var(--c) 70%,#fff)}
.row.me .n::after{content:" ◀";color:var(--brand)}
.track{height:10px;border-radius:5px;background:var(--panel2);overflow:hidden}
.track i{display:block;height:100%;background:var(--c);box-shadow:0 0 8px var(--c)}
.num,.ev{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.ev{color:var(--muted)}
.strat{display:flex;flex-direction:column;gap:14px}
.grid{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:1px;background:#000;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.cell{position:relative;aspect-ratio:1;background:#1a1522;border:0;padding:0;cursor:pointer;overflow:hidden}
.cell .fill{position:absolute;left:0;right:0;bottom:0;display:flex}
.cell .fill i{display:block;height:100%;background:var(--c)}
.cell span{position:absolute;left:3px;top:2px;font:600 clamp(7px,1.2vw,12px)/1.1 var(--f-m);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.9);z-index:1}
.cell.none span{color:#4e4560;text-shadow:none}
.cell.me{box-shadow:inset 0 0 0 2px #fff;z-index:2}
.cell.sel{box-shadow:inset 0 0 0 2px var(--brand);z-index:2}
.side{display:flex;flex-direction:column;gap:10px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:5px}
.tile{border-radius:6px;padding:8px 10px;background:color-mix(in srgb,var(--c) 30%,#0d0a12);border:1px solid color-mix(in srgb,var(--c) 60%,transparent);display:flex;flex-direction:column;min-height:92px}
.tile .tn{font:700 14px var(--f-d)}
.tile .tp{font:800 clamp(22px,3vw,30px)/1 var(--f-d);margin-top:auto}
.tile .tc{font:500 11px var(--f-m);color:rgba(255,255,255,.7);text-align:right}
.totbar{display:flex;height:12px;border-radius:3px;overflow:hidden;background:var(--panel2)}
.totbar i{display:block;height:100%;background:var(--c)}
.htitle{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font:700 14px var(--f-d)}
.htitle span{color:var(--muted);font:500 12px var(--f-m)}
.combos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:4px}
.combo{position:relative;border-radius:5px;overflow:hidden;background:#1a1522;min-height:82px;display:flex;flex-direction:column;justify-content:space-between;padding:5px 6px}
.combo .bg{position:absolute;inset:0;display:flex}
.combo .bg i{display:block;height:100%;background:var(--c);opacity:.85}
.combo .cc{position:relative;align-self:flex-start;display:flex;gap:2px}
.combo .cc i{font:800 12px/1 var(--f-d);font-style:normal;color:#fff;padding:3px 4px;border-radius:3px;box-shadow:0 0 0 1px rgba(0,0,0,.3)}
.combo .lines{position:relative;font:600 10.5px/1.35 var(--f-m);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.95)}
.combo.me{box-shadow:inset 0 0 0 2px #fff}
.empty{font:500 12px var(--f-m);color:var(--muted)}
.next{align-self:flex-end;min-height:50px;padding:0 34px;border-radius:8px;border:0;background:var(--brand);color:#fff;font:800 15px var(--f-d);cursor:pointer;box-shadow:0 0 22px var(--brand)}

/* summary */
.sum{display:flex;flex-direction:column;gap:16px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px 18px;max-width:640px;width:100%;margin:0 auto}
.big{font:800 clamp(44px,9vw,64px)/1 var(--f-d);color:#ffe0f0;text-shadow:0 0 10px var(--brand),0 0 30px var(--brand)}
.big small{font-size:.4em;color:var(--muted);text-shadow:none;margin-left:6px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.stat .k{font:500 12px var(--f-m);color:var(--muted)}
.stat .v{font:700 20px var(--f-m)}
.list{display:flex;flex-direction:column;gap:6px}
.li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);font:500 13px var(--f-m);cursor:pointer;text-align:left;min-height:44px}
.li .dot{width:8px;height:8px;border-radius:50%;box-shadow:0 0 6px currentColor}
.li .hand{font-weight:700;min-width:52px}
.li .sp{flex:1;color:var(--muted)}
.btns{display:flex;gap:8px;justify-content:flex-end}
.ghost{min-height:46px;padding:0 20px;border-radius:8px;border:1.5px solid var(--cyan);background:transparent;color:#dcfeff;font:600 14px var(--f-d);cursor:pointer;box-shadow:0 0 10px rgba(34,240,255,.35)}
.foot{font:500 11px var(--f-m);color:#5e5470;text-align:center}
@media(max-width:420px){
  .row{grid-template-columns:84px minmax(0,1fr) 40px 64px;gap:8px;font-size:12px}
  .date{display:none}
  .prog span{width:14px}
}
@media(prefers-reduced-motion:no-preference){.res,.sum{animation:up .25s ease-out}@keyframes up{from{transform:translateY(8px);opacity:.4}to{transform:none;opacity:1}}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="logo">Daily<b>GTO</b></div>
  <span class="date" id="date"></span>
  <span class="sp"></span>
  <div class="prog" id="prog"></div>
  <span class="chip" id="streak"></span>
</div></header>
<main class="main" id="app"></main>
<script src="data/questions.js"></script>
<script>
{
const POS=["UTG","HJ","CO","BTN","SB","BB"];
const SUIT={s:"♠",h:"♥",d:"♦",c:"♣"};
const SC={s:"s",h:"h_",d:"d",c:"c"};
const R="AKQJT98765432";
const N=5;
const app=document.getElementById("app");
const KEY="dgto-v1";
let store={};
try{store=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}};
const dayNum=Math.floor((Date.now()+9*3600e3)/864e5);
const dkey=d=>new Date(d*864e5).toISOString().slice(0,10);
const today=dkey(dayNum);
document.getElementById("date").textContent=today.replace(/-/g,".");
const pool=DATA.pool;
const daily=Array.from({length:N},(_,i)=>(dayNum*N+i)%pool.length);
let mode="daily",qi=0,practice=[],pans=[];
store[today]=store[today]||{a:[]};
const rec=store[today];

const rk=c=>c[0]==="T"?"10":c[0];
const cardHTML=(c,x="")=>`<div class="card ${SC[c[1]]} ${x}">${rk(c)}<small>${SUIT[c[1]]}</small></div>`;
const mini=c=>`<i class="${SC[c[1]]}">${c[0]}</i>`;
const clsOf=c=>{const a=c[0],b=c[2];if(a===b)return a+b;const[h,l]=[a,b].sort((x,y)=>R.indexOf(x)-R.indexOf(y));return h+l+(c[1]===c[3]?"s":"o")};
const fmt=x=>(Math.round(x*10)/10).toString();
const col=k=>`var(--${k})`;
const pct=x=>Math.round(x*100);
const kind=t=>t.startsWith("Check")?"check":t.startsWith("Call")?"call":t.startsWith("Fold")?"fold":t.startsWith("Raise")?"raise":t.startsWith("Allin")?"allin":"bet_s";

function replay(spot,node){
  let board=spot.flop.match(/../g),pot=5.5,bets=[0,0],stack=[97.5,97.5],p=0,last=[null,null];
  const h=[["w","BTN","100","Raise 2.5"],["w","BB","99","Call"],["s","FLOP",fmt(pot),board]];
  for(const t of node.path){
    if(/^[2-9TJQKA][shdc]$/.test(t)){pot+=bets[0]+bets[1];bets=[0,0];board=[...board,t];p=0;h.push(["s","TURN",fmt(pot),[t]]);last=[null,null];continue}
    const who=p===0?"BB":"BTN",c=t[0],v=+t.slice(1)/10,before=stack[p];let txt;
    if(c==="X")txt="Check";
    else if(c==="C"){stack[p]-=bets[1-p]-bets[p];bets[p]=bets[1-p];txt="Call"}
    else if(c==="F")txt="Fold";
    else{stack[p]-=v-bets[p];bets[p]=v;txt=(c==="B"?"Bet ":c==="R"?"Raise ":"Allin ")+fmt(v)}
    h.push(["w",who,fmt(before),txt]);last[p]=txt;p=1-p;
  }
  return{board,pot,bets,stack,h,last};
}

function histHTML(s,hero){
  const pi=hero==="BB"?0:1;
  return s.h.map(x=>x[0]==="s"
    ?`<div class="h street"><span class="w">${x[1]}</span><span class="st">${x[2]}</span><span class="mini">${x[3].map(mini).join("")}</span></div>`
    :`<div class="h"><span class="w">${x[1]}</span><span class="st">${x[2]}</span><span class="ac" style="--c:${col(kind(x[3]))}">${x[3]}</span></div>`).join("")
    +`<div class="h now"><span class="w" style="color:#ffb3d9">${hero}</span><span class="st">${fmt(s.stack[pi])}</span><span class="ac">?</span></div>`;
}

function tableHTML(spot,node,q){
  const s=replay(spot,node),hero=node.player,hi=POS.indexOf(hero);
  const slots=[[42,92],[12,68],[12,31],[50,7],[88,31],[88,68]];
  const betAt=[[50,77],[29,63],[29,36],[50,21],[71,36],[71,63]];
  const dAt=[[28,90],[22,79],[22,44],[63,13],[78,44],[78,79]];
  let h="",b="";
  POS.forEach((p,i)=>{
    const k=(i-hi+6)%6,[x,y]=slots[k];
    const live=p==="BTN"||p==="BB",me=p===hero,pi=p==="BB"?0:1;
    const st=live?fmt(s.stack[pi]):p==="SB"?"99.5":"100";
    const side=y<15?"dn":x>50?"l":"r";
    const cards=me?`<div class="hole r">${cardHTML(q.c.slice(0,2))}${cardHTML(q.c.slice(2))}</div>`:live?`<div class="hole ${side}"><div class="card back"></div><div class="card back"></div></div>`:"";
    const say=me?`<div class="you">YOU</div>`:live&&s.last[pi]?`<div class="say ${kind(s.last[pi])}" style="--c:${col(kind(s.last[pi]))}">${s.last[pi]}</div>`:"";
    h+=`<div class="seat ${me?"hero":live?"vil":"out"}" style="left:${x}%;top:${y}%">${say}<div class="disc"><b>${p}</b><span>${st}</span></div>${cards}</div>`;
    if(p==="BTN"){const[dx,dy]=dAt[k];h+=`<div class="dealer" style="left:${dx}%;top:${dy}%">D</div>`}
    if(live&&s.bets[pi]>0){const[bx,by]=betAt[k];b+=`<div class="bet" style="left:${bx}%;top:${by}%"><i></i>${fmt(s.bets[pi])}</div>`}
  });
  return{s,html:`<div class="tablewrap"><div class="table"><div class="rail"></div><div class="center"><div class="spot">BTN vs. BB, SRP, 100bb</div><div class="pot">${fmt(s.pot)} bb</div><div class="board">${s.board.map((c,i)=>cardHTML(c,i===3?"new":"")).join("")}</div></div>${h}${b}</div></div>`};
}

function grade(q,i){
  const f=q.f[i],l=q.l[i],top=q.f.indexOf(Math.max(...q.f));
  if(i===top||f>=.5)return["best","Best move","var(--good)"];
  if(f>=.2||l<=.03)return["correct","Correct move","var(--ok)"];
  if(l<=.15)return["inacc","Inaccuracy","var(--warn)"];
  return["mistake","Wrong move","var(--bad)"];
}
const right=g=>g==="best"||g==="correct";

function progress(){
  const el=document.getElementById("prog");
  el.innerHTML=mode!=="daily"?"":daily.map((_,i)=>{const a=rec.a[i];if(a==null)return`<span class="${i===qi?"on":""}"></span>`;const g=grade(pool[daily[i]],a)[0];return`<span class="${right(g)?"g":g==="inacc"?"y":"r"}"></span>`}).join("");
  const done=d=>store[dkey(d)]&&store[dkey(d)].a.filter(x=>x!=null).length>=N;
  let k=0,d=dayNum;if(!done(d))d--;while(done(d)){k++;d--}
  document.getElementById("streak").innerHTML=`Streak <b>${k}</b>`;
}

function render(){
  progress();
  const q=pool[mode==="daily"?daily[qi]:practice[qi]],spot=DATA.spots[q.s],node=spot.nodes[q.n];
  const ans=mode==="daily"?rec.a[qi]:pans[qi];
  const t=tableHTML(spot,node,q);
  const top=q.f.indexOf(Math.max(...q.f));
  const opts=node.acts.map((a,i)=>`<button class="opt${ans!=null?(i===ans?" pick":" dim")+(i===top?" gto":""):""}" data-i="${i}" style="--c:${col(a.k)}" ${ans!=null?"disabled":""}>${a.t}${ans!=null?`<span class="fq">${pct(q.f[i])}%</span>`:a.amt&&a.k.startsWith("bet")?`<small>${fmt(a.amt)} bb</small>`:""}</button>`).join("");
  const vp=node.player==="BB"?1:0,va=t.s.last[vp],vn=node.player==="BB"?"BTN":"BB";
  let bar;
  if(ans==null)bar=`<div class="prompt"><span class="vil">${vn}</span>${va?`<span class="pa" style="--c:${col(kind(va))}">${va}</span>`:""}<span class="arr">→</span><span class="me">YOUR MOVE · ${node.player}</span></div>`;
  else{const[gk,gt,gc]=grade(q,ans);bar=`<div class="vbar" style="--vb:${gc}"><b>${right(gk)?"✓":"✗"} ${gt}</b><span>${node.acts[ans].t}${q.l[ans]>0?`<br>EV −${q.l[ans].toFixed(2)}bb`:""}</span></div>`}
  app.innerHTML=`<div class="hist">${histHTML(t.s,node.player)}</div>
  ${t.html}
  ${bar}
  <div class="opts" id="opts">${opts}</div>
  <div id="res"></div>`;
  const hs=app.querySelector(".hist");hs.scrollLeft=hs.scrollWidth;
  document.getElementById("opts").onclick=e=>{const b=e.target.closest(".opt");if(b&&!b.disabled)answer(+b.dataset.i)};
  if(ans!=null)result(q,node,ans);
}

function answer(i){
  if(mode==="daily"){rec.a[qi]=i;save()}else pans[qi]=i;
  const y=scrollY;render();scrollTo(0,y);
}

function result(q,node,i){
  const[,gt,gc]=grade(q,i),me=clsOf(q.c),acts=node.acts;
  const rows=acts.map((a,j)=>`<div class="row${j===i?" me":""}" style="--c:${col(a.k)}"><span class="n">${a.t}</span><div class="track"><i style="width:${q.f[j]*100}%"></i></div><span class="num">${pct(q.f[j])}%</span><span class="ev">${q.l[j]===0?"EV max":"−"+q.l[j].toFixed(2)+"bb"}</span></div>`).join("");
  let g="";
  for(let r=0;r<13;r++)for(let c=0;c<13;c++){
    const k=r===c?R[r]+R[c]:r<c?R[r]+R[c]+"s":R[c]+R[r]+"o",v=node.chart[k];
    const fill=v?`<div class="fill" style="height:${Math.max(v[0]*100,8)}%">${acts.map((a,j)=>v[j+1]>0?`<i style="width:${v[j+1]*100}%;--c:${col(a.k)}"></i>`:"").join("")}</div>`:"";
    g+=`<button class="cell${v?"":" none"}${k===me?" me":""}" data-k="${k}" aria-label="${k}">${fill}<span>${k}</span></button>`;
  }
  const tiles=acts.map((a,j)=>`<div class="tile" style="--c:${col(a.k)}"><span class="tn">${a.t}</span><span class="tp">${(node.tot[j]*100).toFixed(1)}%</span><span class="tc">${node.cmb[j].toFixed(1)} combos</span></div>`).join("");
  const tot=acts.map((a,j)=>`<i style="width:${node.tot[j]*100}%;--c:${col(a.k)}"></i>`).join("");
  const last=mode==="daily"&&qi===N-1;
  document.getElementById("res").innerHTML=`<div class="res">
    <div class="card2"><div class="verdict"><span class="vmeta">${q.c.replace(/(..)(..)/,"$1 $2")} · Equity <b>${pct(q.eq)}%</b>${q.l[i]>0?` · EV loss <b>${q.l[i].toFixed(2)}bb</b>`:""}</span></div><div class="rows">${rows}</div></div>
    <div class="card2 strat">
      <div class="grid" id="grid">${g}</div>
      <div class="side"><div class="htitle">${node.player} Strategy</div><div class="tiles">${tiles}</div><div class="totbar">${tot}</div>
      <div class="htitle" id="ht"></div><div class="combos" id="combos"></div></div>
    </div>
    <button class="next" id="next">${last?"결과":"다음"}</button>
  </div>`;
  const grid=document.getElementById("grid");
  const show=k=>{
    grid.querySelectorAll(".sel").forEach(e=>e.classList.remove("sel"));
    if(k!==me)grid.querySelector(`[data-k="${k}"]`)?.classList.add("sel");
    const list=node.combos[k]||[];
    document.getElementById("ht").innerHTML=`Hands · ${k}<span>${list.length} combos</span>`;
    document.getElementById("combos").innerHTML=list.length?list.map(([c,w,...s])=>`<div class="combo${c===q.c?" me":""}"><div class="bg">${acts.map((a,j)=>s[j]>0?`<i style="width:${s[j]*100}%;--c:${col(a.k)}"></i>`:"").join("")}</div><span class="cc">${mini(c.slice(0,2))}${mini(c.slice(2))}</span><div class="lines">${acts.map((a,j)=>`${a.t} ${pct(s[j])}`).join("<br>")}</div></div>`).join(""):`<div class="empty">Not in range</div>`;
  };
  show(me);
  grid.onclick=e=>{const c=e.target.closest(".cell");if(c)show(c.dataset.k)};
  document.getElementById("next").onclick=()=>{
    if(mode==="daily"){if(last)summary();else{qi++;render();scrollTo(0,0)}}
    else{qi++;if(qi>=practice.length)practice.push(...shuffle());render();scrollTo(0,0)}
  };
}

function shuffle(){const a=pool.map((_,i)=>i);for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function summary(){
  mode="daily";qi=N;progress();
  const res=daily.map((d,i)=>{const q=pool[d],a=rec.a[i];return{q,a,g:grade(q,a),node:DATA.spots[q.s].nodes[q.n]}});
  const ok=res.filter(r=>right(r.g[0])).length,loss=res.reduce((s,r)=>s+r.q.l[r.a],0);
  app.innerHTML=`<div class="sum">
    <div class="big">${ok}<small>/ ${N}</small></div>
    <div class="stats">
      <div class="stat"><div class="k">Total EV loss</div><div class="v">${loss.toFixed(2)}</div></div>
      <div class="stat"><div class="k">Best move</div><div class="v">${res.filter(r=>r.g[0]==="best").length}</div></div>
      <div class="stat"><div class="k">Wrong move</div><div class="v">${res.filter(r=>r.g[0]==="mistake").length}</div></div>
    </div>
    <div class="list">${res.map((r,i)=>`<button class="li" data-i="${i}"><span class="dot" style="background:${r.g[2]};color:${r.g[2]}"></span><span class="hand">${r.q.c}</span><span class="sp">${r.node.player} · ${r.node.acts[r.a].t}</span><span>${r.g[1]}</span></button>`).join("")}</div>
    <div class="btns"><button class="ghost" id="more">추가 문제</button></div>
  </div><div class="foot">Next set 00:00 KST</div>`;
  app.querySelector(".list").onclick=e=>{const b=e.target.closest(".li");if(b){qi=+b.dataset.i;render();scrollTo(0,0)}};
  document.getElementById("more").onclick=()=>{mode="practice";practice=shuffle();pans=[];qi=0;render();scrollTo(0,0)};
}

const open=daily.findIndex((_,i)=>rec.a[i]==null);
if(open<0)summary();else{qi=open;render()}
}
</script>
</body>
</html>
